name: Data science project checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  vehicle-rental-eda:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project dependencies
        run: python -m pip install --upgrade pip pandas matplotlib pytest flake8
      - name: Lint featured project
        run: flake8 04-data-science-and-analysis/projects/vehicle-rental-pricing-eda --count --select=E9,F63,F7,F82 --show-source --statistics
      - name: Run tests
        run: python -m pytest 04-data-science-and-analysis/projects/vehicle-rental-pricing-eda/tests -v
